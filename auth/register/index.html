<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body>
    <div
      class="min-h-screen flex items-center justify-center bg-gray-100 px-4 sm:px-6 lg:px-8"
    >
      <div
        class="w-full max-w-md bg-white p-8 rounded-lg shadow-md animate-in fade-in zoom-in duration-300"
      >
        <div class="flex flex-col items-center mb-6">
          <img src="/images/noroff-logo.png" alt="Logo" class="w-60 mb-3" />
          <h2 class="text-xl font-semibold text-gray-700">Create an Account</h2>
          <p class="text-gray-500 text-center">Sign up to get started</p>
        </div>

        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
          Register
        </h1>

        <form
          name="register"
          action="/auth/register/"
          method="post"
          class="space-y-6"
        >
          <div>
            <label
              for="name"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Name</label
            >
            <input
              id="name"
              type="text"
              name="name"
              required
              maxlength="20"
              pattern="^[\w]+$"
              title="Please enter a username using only letters and numbers"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Email</label
            >
            <input
              id="email"
              type="email"
              name="email"
              required
              pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
              title="Please enter a valid noroff.no or stud.noroff.no address"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Password</label
            >
            <input
              type="password"
              name="password"
              id="password"
              required
              minlength="8"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div class="text-right">
            <a
              href="/auth/login/"
              class="text-sm text-blue-500 hover:underline transition-all hover:scale-105"
              >Already have an account? Log in</a
            >
          </div>

          <div>
            <input
              type="submit"
              value="Register"
              class="w-full bg-red-500 text-white font-semibold py-2 rounded-lg hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-all hover:scale-105"
            />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
