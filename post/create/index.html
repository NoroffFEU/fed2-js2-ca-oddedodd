<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post - Noroff FED2 JS2 CA</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="module" src="/src/app.js"></script>
  </head>

  <body>
    <main class="flex items-center justify-center min-h-screen bg-gray-100 p-4">
      <div
        class="max-w-lg w-full bg-white p-8 rounded-lg shadow-md space-y-6 animate-fade-in"
      >
        <h1 class="text-2xl font-bold text-center text-gray-700">
          Create a New Post
        </h1>
        <form
          name="createPost"
          id="create-post-form"
          action="/post/create/"
          method="post"
          class="space-y-4"
        >
          <div class="flex flex-col space-y-1">
            <label for="title" class="text-gray-700 font-medium">Title:</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="Enter post title"
              required
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            />
          </div>

          <div class="flex flex-col space-y-1">
            <label for="body" class="text-gray-700 font-medium">Body:</label>
            <textarea
              id="body"
              name="body"
              rows="4"
              placeholder="Write your post content here"
              required
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            ></textarea>
          </div>

          <div class="flex flex-col space-y-1">
            <label for="tags" class="text-gray-700 font-medium">Tags:</label>
            <input
              type="text"
              id="tags"
              name="tags"
              placeholder="tags, separated, by, commas"
              required
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            />
          </div>

          <div class="flex flex-col space-y-1">
            <label for="media" class="text-gray-700 font-medium"
              >Media/Image URL:</label
            >
            <input
              type="url"
              id="media"
              name="media"
              placeholder="Enter image or media URL (optional)"
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            />
          </div>

          <input
            type="submit"
            value="Create Post"
            class="w-full bg-red-500 text-white font-semibold p-2 rounded hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 cursor-pointer transition-all hover:scale-105"
          />
        </form>
      </div>
    </main>
  </body>
</html>
