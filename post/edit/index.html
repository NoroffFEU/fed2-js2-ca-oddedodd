<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit post Post - Noroff FED2 JS2 CA</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="module" src="/src/app.js"></script>
  </head>

  <body>
    <main class="flex items-center justify-center min-h-screen bg-gray-100 p-4">
      <!-- Edit Post Form Container -->
      <div
        class="max-w-lg w-full bg-white p-8 rounded-lg shadow-md space-y-6 animate-fade-in"
      >
        <h1 class="text-2xl font-bold text-center text-gray-700">Edit Post</h1>
        <form
          name="editPost"
          id="create-post-form"
          action="/post/edit/"
          method="post"
          class="space-y-4"
        >
          <!-- Title Input -->
          <div class="flex flex-col space-y-1">
            <label for="title-edit" class="text-gray-700 font-medium"
              >Title:</label
            >
            <input
              type="text"
              id="title-edit"
              name="title"
              required
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            />
          </div>

          <!-- Body Textarea -->
          <div class="flex flex-col space-y-1">
            <label for="body-edit" class="text-gray-700 font-medium"
              >Body:</label
            >
            <textarea
              id="body-edit"
              name="body"
              rows="4"
              placeholder="Write your post content here"
              required
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            ></textarea>
          </div>

          <!-- Tags Input -->
          <div class="flex flex-col space-y-1">
            <label for="tags-edit" class="text-gray-700 font-medium"
              >Tags:</label
            >
            <input
              type="text"
              id="tags-edit"
              name="tags"
              placeholder="tags, separated, by, commas"
              required
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            />
          </div>

          <!-- Media/Image URL Input -->
          <div class="flex flex-col space-y-1">
            <label for="media-edit" class="text-gray-700 font-medium"
              >Media/Image URL:</label
            >
            <input
              type="url"
              id="media-edit"
              name="media"
              placeholder="Enter image or media URL (optional)"
              class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            />
          </div>

          <!-- Hidden Input for Post ID -->
          <input type="hidden" id="id-edit" name="postid" />

          <!-- Submit Button -->
          <input
            type="submit"
            value="Update Post"
            class="w-full bg-red-500 text-white font-semibold p-2 rounded hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 cursor-pointer transition-all hover:scale-105"
          />
        </form>
      </div>
    </main>
  </body>
</html>
